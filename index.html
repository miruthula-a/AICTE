          const utter = new SpeechSynthesisUtterance(briefingText);
          utter.rate = 1.05;
          utter.pitch = 1.0;
          utter.onend = () => setIsSpeaking(false);
          utter.onerror = () => setIsSpeaking(false);
          setIsSpeaking(true);
          window.speechSynthesis.speak(utter);
          showToast('Executive audio briefing playback initialized.');

              auditId: 'AICTE-APH26-' + Math.random().toString(36).substring(2, 9).toUpperCase(),

              return updated;

            if (f.id === id && f.currentStageId < 5) {

                ...f,

                    <div className="flex items-center gap-2">
                      <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-mono text-[11px] font-bold">
                        AICTE VERIFIED TELEMETRY
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-mono flex items-center gap-3 animate-bounce">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span>{toastMessage}</span>
              </div>
            )}

            {/* ==================================================== */}
            {/* 7. MODAL: AICTE APH 2026-27 STATUTORY REGULATIONS   */}
            {/* ==================================================== */}
            {showHandbookModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto bg-slate-950/80 backdrop-blur-md">
                <div className="relative w-full max-w-3xl bg-white border border-slate-200 rounded-3xl shadow-modal overflow-hidden my-auto max-h-[92vh] flex flex-col">
                  
                  <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-base text-white">AICTE Approval Process Handbook 2026-27</h3>
                      <p className="text-xs text-slate-400">Statutory Norms & Verification Clauses Reference Guide</p>
                    </div>
                    <button onClick={() => setShowHandbookModal(false)} className="p-1.5 rounded-xl hover:bg-white/10 text-white">
                      <IconClose className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-6 overflow-y-auto space-y-4 text-xs">
                    {[
                      { clause: "Clause 1.4", title: "Statutory Power & Mandate for Technical Institutions", desc: "AICTE Act 1987 Section 10(k) grants the Council statutory authority to inspect, grant approval, or withdraw sanction for all engineering and technology institutions." },
                      { clause: "Clause 2.14", title: "Joint Corpus Escrow Bank FDR Requirement", desc: "Technical institutions must maintain a joint FDR of minimum ₹1.00 Crore (for UG Engineering) deposited in a Nationalized / Scheduled bank jointly with AICTE for 10-30 years." },
                      { clause: "Clause 4.8", title: "Cadre Proportion & Faculty-to-Student Ratio (FSR)", desc: "Statutory FSR is mandatory at 1:15 for UG Engineering & Technology. Cadre distribution must strictly adhere to 1 Professor : 2 Associate Professors : 6 Assistant Professors." },
                      { clause: "Clause 7.2", title: "Instructional & Administrative Built-Up Space", desc: "A minimum built-up instructional carpet area of 4,200 sq.m is required for an intake of 360 students, with dedicated computing suites and CAD drafting centres." },
                      { clause: "Clause 9.3", title: "Barrier-Free Access for Divyangjan Students", desc: "Mandates 1:12 ramp gradient slopes, wheelchair accessible lifts with tactile Braille buttons, and unisex accessible washroom facilities on every instructional floor." },
                      { clause: "Clause 11.2", title: "State Fire Safety NOC & Life Protection", desc: "Valid State Fire Service clearance and an active dedicated pressurized fire hydrant ring network with pump room are mandatory prerequisites." },
                      { clause: "Clause 14.1", title: "Anti-Ragging Committee & 24/7 CCTV Telemetry", desc: "Mandatory establishment of an Anti-Ragging Cell under Supreme Court guidelines and continuous recording CCTV coverage across administrative portals." }
                    ].map((item, idx) => (
                      <div key={idx} className="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-1">
                        <div className="flex items-center justify-between">
                          <span className="font-mono text-blue-700 font-bold px-2 py-0.5 rounded bg-blue-100 text-[10px]">
                            {item.clause}
                          </span>
                          <span className="text-[10px] text-slate-400 font-mono">APH 2026-27</span>
                        </div>
                        <h4 className="font-bold text-sm text-slate-900">{item.title}</h4>
                        <p className="text-slate-600 leading-relaxed">{item.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                    <button onClick={() => setShowHandbookModal(false)} className="px-5 py-2 bg-blue-600 text-white rounded-xl font-semibold text-xs">
                      Close Reference
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* 8. MODAL: STATUTORY DEFICIENCY NOTICE GENERATOR      */}
            {/* ==================================================== */}
            {showDeficiencyNoticeModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto bg-slate-950/80 backdrop-blur-md">
                <div className="relative w-full max-w-2xl bg-white border border-slate-200 rounded-3xl shadow-modal overflow-hidden my-auto p-6 sm:p-8 space-y-5">
                  <div className="flex items-center justify-between border-b pb-3 border-slate-200">
                    <div>
                      <span className="text-[10px] font-mono font-bold text-rose-600 uppercase">OFFICIAL REGULATORY CIRCULAR</span>
                      <h3 className="font-bold text-base text-slate-900">Show-Cause & Deficiency Rectification Notice</h3>
                    </div>
                    <button onClick={() => setShowDeficiencyNoticeModal(null)} className="p-1 rounded-lg hover:bg-slate-100 text-slate-400">
                      <IconClose className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="space-y-3 text-xs text-slate-700 leading-relaxed font-sans">
                    <p><strong>To: The Chairman / Governing Body,</strong><br />{showDeficiencyNoticeModal.instituteName}<br />{showDeficiencyNoticeModal.location}</p>
                    <p><strong>Ref File: </strong><span className="font-mono">{showDeficiencyNoticeModal.fileNumber}/APH-DEF/2026</span></p>
                    <p>
                      Whereas your institutional approval docket was scrutinized under AICTE Regulations 2026, the following statutory non-compliances were recorded by the Competent Scrutiny Cell:
                    </p>

                    <div className="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 space-y-1 font-mono text-xs">
                      <strong>FLAGGED NON-COMPLIANCE DEFICIT:</strong>
                      <p>• Status: {showDeficiencyNoticeModal.statusText}</p>
                      <p>• Current Recorded FSR: {showDeficiencyNoticeModal.metrics.fsr.actual} (Statutory Requirement: 1:15)</p>
                      <p>• Fire NOC Validity: {showDeficiencyNoticeModal.metrics.fireNoc.label}</p>
                    </div>

                    <p>
                      You are hereby directed to submit an attested compliance affidavit along with valid supporting receipts/certificates within <strong>7 working days</strong>, failing which the Council may initiate penal reduction in sanctioned intake or adjourn hearing.
                    </p>
                  </div>

                  <div className="flex items-center justify-between pt-4 border-t border-slate-200 text-xs">
                    <span className="text-slate-500 font-mono">Issued by: {showDeficiencyNoticeModal.officer.name}</span>
                    <div className="flex gap-2">
                      <button onClick={() => window.print()} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-semibold">
                        Print Notice
                      </button>
                      <button onClick={() => { setShowDeficiencyNoticeModal(null); showToast('Statutory Deficiency Notice dispatched.'); }} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-semibold shadow-sm">
                        Dispatch Notice →
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================================================== */}
            {/* 9. MODAL: REGIONAL COMPLIANCE ANALYTICS              */}
            {/* ==================================================== */}
            {showAnalyticsModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto bg-slate-950/80 backdrop-blur-md">
                <div className="relative w-full max-w-3xl bg-white border border-slate-200 rounded-3xl shadow-modal overflow-hidden my-auto p-6 sm:p-8 space-y-6">
                  <div className="flex items-center justify-between border-b pb-3 border-slate-200">
                    <div>
                      <h3 className="font-bold text-lg text-slate-900">National Regional Compliance Performance Analytics</h3>
                      <p className="text-xs text-slate-500">Comparative metrics across all 8 Regional Offices for AY 2026-27</p>
                    </div>
                    <button onClick={() => setShowAnalyticsModal(false)} className="p-1 rounded-lg hover:bg-slate-100 text-slate-400">
                      <IconClose className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="space-y-3">
                    <strong className="text-xs font-bold text-slate-800 block uppercase font-mono">
                      Regional Compliance Ranking & Sanctioned Seat Volumes:
                    </strong>

                    <div className="space-y-2.5">
                      {REGIONS.filter(r => r.code !== 'ALL').map(reg => {
                        const regColleges = files.filter(f => f.region === reg.code);
                        const avg = Math.round(regColleges.reduce((acc, f) => acc + f.complianceScore, 0) / (regColleges.length || 1));
                        const totalIntake = regColleges.reduce((acc, f) => acc + f.intake, 0);

                        return (
                          <div key={reg.code} className="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                            <div className="min-w-[180px]">
                              <strong className="text-slate-900 font-bold block">{reg.code} • {reg.city}</strong>
                              <span className="text-[11px] text-slate-500">{regColleges.length} Institutions • {totalIntake} Approved Seats</span>
                            </div>

                            <div className="flex-1 max-w-xs space-y-1">
                              <div className="flex justify-between text-[11px] font-mono">
                                <span>Compliance Index</span>
                                <strong className={avg >= 85 ? 'text-emerald-700' : 'text-amber-700'}>{avg}%</strong>
                              </div>
                              <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${avg >= 85 ? 'bg-emerald-600' : 'bg-amber-500'}`} style={{ width: `${avg}%` }}></div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="p-4 bg-blue-50 border border-blue-200 rounded-2xl text-xs text-blue-950 flex items-center justify-between">
                    <div>
                      <strong className="block font-bold">National SLA Velocity: 26.4 Days</strong>
                      <span className="text-[11px] opacity-80">Approvals moving 24% faster than statutory 35-day deadline.</span>
                    </div>
                    <button onClick={() => setShowAnalyticsModal(false)} className="px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold">
                      Done
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Clean Modern Footer */}
            <footer className="border-t border-slate-200 bg-white py-4 px-6 text-xs text-slate-500 mt-auto">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                  <span className="font-semibold text-slate-700">FileTrail AICTE Regulatory Platform</span>
                </div>
                <div>
                  National Institutional Approval & Compliance Monitoring Architecture
                </div>
              </div>
            </footer>

          </div>
        );
      }

      // Render App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
